<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Esqueci a Senha')}">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="display-6 fw-bold text-primary mb-3">
                                <i class="bi bi-key-fill"></i>
                            </div>
                            <h4 class="fw-bold">Recuperar Senha</h4>
                            <p class="text-muted small">Insira seu e-mail para receber as instruções de recuperação.</p>
                        </div>

                        <form th:action="@{/forgot_password}" method="post">
                            <div th:if="${error}" class="alert alert-danger mb-4 shadow-sm" th:text="${error}"></div>
                            <div th:if="${message}" class="alert alert-success mb-4 shadow-sm" th:text="${message}"></div>

                            <div class="form-floating mb-4">
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                                <label for="email">E-mail Cadastrado</label>
                            </div>

                            <div class="d-grid">
                                <button class="btn btn-primary btn-lg shadow-sm" type="submit">Enviar Link de Redefinição</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-white border-0 py-4 text-center">
                        <a th:href="@{/login}" class="text-decoration-none fw-bold text-primary small">
                            <i class="bi bi-arrow-left me-1"></i>Voltar para o Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- VLibras Plugin -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Fim VLibras Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
