<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Redefinir Senha')}">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="display-6 fw-bold text-success mb-3">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                            <h4 class="fw-bold">Nova Senha</h4>
                            <p class="text-muted small">Defina sua nova senha de acesso abaixo.</p>
                        </div>

                        <form th:action="@{/reset_password}" method="post">
                            <div th:if="${error}" class="alert alert-danger mb-4 shadow-sm" th:text="${error}"></div>

                            <input type="hidden" name="token" th:value="${token}" />

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Nova senha" required autofocus>
                                <label for="password">Nova Senha</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirme a senha" required>
                                <label for="confirmPassword">Confirmar Nova Senha</label>
                            </div>

                            <div class="d-grid">
                                <button class="btn btn-success btn-lg shadow-sm" type="submit">Salvar Nova Senha</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
