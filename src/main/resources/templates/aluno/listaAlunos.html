<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Alunos')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Alunos</li>
            </ol>
        </nav>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
                <h5 class="card-title mb-0 fw-bold"><i class="bi bi-people-fill me-2 text-primary"></i>Lista de Alunos</h5>
                <div class="d-flex gap-2">
                    <a th:href="@{/relatorios/alunos/pdf}" class="btn btn-outline-secondary btn-sm shadow-sm">
                        <i class="bi bi-file-earmark-pdf me-1"></i>Exportar PDF
                    </a>
                    <a th:href="@{/alunos/criar}" class="btn btn-success btn-sm shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i>Novo Aluno
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th class="d-none d-md-table-cell">Telefone</th>
                                <th class="d-none d-lg-table-cell">CPF</th>
                                <th>Curso</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="aluno : ${alunos}">
                                <td class="fw-semibold text-primary" th:text="${aluno.nomeAluno}"></td>
                                <td th:text="${aluno.emailAluno}"></td>
                                <td class="d-none d-md-table-cell" th:text="${aluno.telefoneAluno}"></td>
                                <td class="d-none d-lg-table-cell" th:text="${aluno.cpfAluno}"></td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${aluno.curso != null ? aluno.curso.nomeCurso : 'N/A'}"></span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group shadow-sm">
                                        <a th:href="@{/relatorios/aluno/{id}/pdf(id=${aluno.idAluno})}" class="btn btn-outline-secondary btn-sm" title="Ficha PDF" target="_blank">
                                            <i class="bi bi-file-pdf"></i>
                                        </a>
                                        <a th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}" class="btn btn-outline-primary btn-sm" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}" 
                                           class="btn btn-outline-danger btn-sm"
                                           title="Excluir"
                                           onclick="return confirm('Tem certeza que deseja excluir este aluno?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(alunos)}">
                                <td colspan="6" class="text-center py-4 text-muted small italic">Nenhum aluno cadastrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- VLibras Plugin -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Fim VLibras Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
