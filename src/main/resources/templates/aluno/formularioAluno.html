<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Cadastro de Aluno')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/alunos/listar}">Alunos</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${aluno.idAluno != null ? 'Editar Aluno' : 'Novo Aluno'}"></li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-person-plus-fill me-2 text-primary"></i>
                            <span th:text="${aluno.idAluno != null ? 'Editar Registro de Aluno' : 'Cadastrar Novo Aluno'}"></span>
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/alunos/salvar}" method="post" th:object="${aluno}" class="needs-validation">
                            <input type="hidden" th:field="*{idAluno}" />

                            <div class="mb-4">
                                <label for="nomeAluno" class="form-label fw-semibold">Nome Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="nomeAluno" th:field="*{nomeAluno}" required placeholder="Ex: João da Silva">
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="emailAluno" class="form-label fw-semibold">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="emailAluno" th:field="*{emailAluno}" placeholder="exemplo@email.com">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="telefoneAluno" class="form-label fw-semibold">Telefone</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                        <input type="text" class="form-control" id="telefoneAluno" th:field="*{telefoneAluno}" required placeholder="(00) 00000-0000">
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="cpfAluno" class="form-label fw-semibold">CPF</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                        <input type="text" class="form-control" id="cpfAluno" th:field="*{cpfAluno}" required placeholder="000.000.000-00">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="cidadeAluno" class="form-label fw-semibold">Cidade</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                        <input type="text" class="form-control" id="cidadeAluno" th:field="*{cidadeAluno}" required placeholder="Ex: Rio de Janeiro">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="enderecoAluno" class="form-label fw-semibold">Endereço</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-house"></i></span>
                                    <input type="text" class="form-control" id="enderecoAluno" th:field="*{enderecoAluno}" required placeholder="Rua, Número, Complemento, Bairro">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="curso" class="form-label fw-semibold">Curso Matriculado</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-journal-bookmark"></i></span>
                                    <select class="form-select" id="curso" th:field="*{curso}" required>
                                        <option value="" disabled selected>Selecione um curso...</option>
                                        <option th:each="c : ${cursos}" th:value="${c.idCurso}" th:text="${c.nomeCurso}"></option>
                                    </select>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/alunos/listar}" class="btn btn-light px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-5 shadow-sm">
                                    <i class="bi bi-check-lg me-1"></i>Salvar Registro
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
