<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Cadastro de Usuário')}">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center py-5">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white py-4 text-center">
                        <h3 class="card-title mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Crie sua Conta</h3>
                        <p class="mb-0 text-white-50">Cadastre-se para acessar o sistema WebSchool</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form th:action="@{/usuarios/salvar}" method="post" th:object="${usuario}" autocomplete="off">
                            <input type="hidden" th:field="*{idUsuario}">
                            
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="nomeUsuario" th:field="*{nomeUsuario}" placeholder="Nome Completo" required>
                                <label for="nomeUsuario">Nome Completo</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="emailUsuario" th:field="*{emailUsuario}" placeholder="nome@exemplo.com" required>
                                <label for="emailUsuario">Endereço de E-mail</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="senhaUsuario" th:field="*{senhaUsuario}" placeholder="Senha" required>
                                <label for="senhaUsuario">Senha de Acesso</label>
                            </div>

                            <div class="mb-3">
                                <label for="roleStatus" class="form-label text-muted small fw-bold text-uppercase">Tipo de Perfil</label>
                                <select class="form-select" id="roleStatus" th:field="*{roleStatus}" required>
                                    <option value="" selected disabled>Escolha o seu perfil...</option>
                                    <option value="ROLE_ADMIN">Administrador</option>
                                    <option value="ROLE_PROFESSOR">Professor</option>
                                    <option value="ROLE_ALUNO">Aluno</option>
                                </select>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}" checked>
                                <label class="form-check-label text-muted" for="ativo">Usuário ativo</label>
                            </div>

                            <div class="d-grid gap-2">
                                <button class="btn btn-primary btn-lg shadow-sm" type="submit">
                                    <i class="bi bi-check-circle me-1"></i>Finalizar Cadastro
                                </button>
                                <a th:href="@{/login}" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a th:href="@{/webschool}" class="text-muted text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i>Voltar para o início
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
