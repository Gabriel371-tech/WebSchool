<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Produtos')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Produtos</li>
            </ol>
        </nav>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
                <h5 class="card-title mb-0 fw-bold"><i class="bi bi-box-seam me-2 text-primary"></i>Lista de Produtos</h5>
                <a th:href="@{/produtos/criar}" class="btn btn-success btn-sm shadow-sm">
                    <i class="bi bi-plus-lg me-1"></i>Novo Produto
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Preço</th>
                                <th>Estoque</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="produto : ${produtos}">
                                <td class="fw-semibold text-primary" th:text="${produto.nomeProduto}"></td>
                                <td class="fw-bold text-success" th:text="${'R$ ' + #numbers.formatDecimal(produto.precoProduto, 1, 2, 'COMMA')}"></td>
                                <td>
                                    <span class="badge" th:classappend="${produto.estoqueProduto > 10 ? 'bg-info text-dark' : 'bg-warning text-dark'}" th:text="${produto.estoqueProduto}"></span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group shadow-sm">
                                        <a th:href="@{/produtos/editar/{id}(id=${produto.idProduto})}" class="btn btn-outline-primary btn-sm" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/produtos/excluir/{id}(id=${produto.idProduto})}" 
                                           class="btn btn-outline-danger btn-sm"
                                           title="Excluir"
                                           onclick="return confirm('Tem certeza que deseja excluir este produto?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(produtos)}">
                                <td colspan="4" class="text-center py-4 text-muted small italic">Nenhum produto cadastrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
