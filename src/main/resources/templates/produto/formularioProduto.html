<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Cadastro de Produto')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/produtos/listar}">Produtos</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${produto.idProduto != null ? 'Editar Produto' : 'Novo Produto'}"></li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-box-seam me-2 text-primary"></i>
                            <span th:text="${produto.idProduto != null ? 'Editar Produto' : 'Cadastro de Produto'}"></span>
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                            <input type="hidden" th:field="*{idProduto}">
                            
                            <div class="mb-4">
                                <label for="nome" class="form-label fw-semibold">Nome do Produto</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-tag"></i></span>
                                    <input type="text" class="form-control" id="nome" th:field="*{nomeProduto}" required placeholder="Ex: Caderno Universitário">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="preco" class="form-label fw-semibold">Preço (R$)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" class="form-control" id="preco" th:field="*{precoProduto}" step="0.01" required placeholder="0,00">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="estoque" class="form-label fw-semibold">Estoque</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-stack"></i></span>
                                        <input type="number" class="form-control" id="estoque" th:field="*{estoqueProduto}" required placeholder="Quantidade">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 justify-content-end mt-5">
                                <a th:href="@{/produtos/listar}" class="btn btn-light px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="bi bi-check-lg me-1"></i>Salvar Produto
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
