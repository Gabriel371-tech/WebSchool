<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Cadastro de Curso')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/cursos/listar}">Cursos</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${curso.idCurso != null ? 'Editar Curso' : 'Novo Curso'}"></li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-journal-plus me-2 text-success"></i>
                            <span th:text="${curso.idCurso != null ? 'Editar Registro de Curso' : 'Cadastrar Novo Curso'}"></span>
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/cursos/salvar}" method="post" th:object="${curso}">
                            <input type="hidden" th:field="*{idCurso}" />

                            <div class="mb-4">
                                <label for="nomeCurso" class="form-label fw-semibold">Nome do Curso</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-book"></i></span>
                                    <input type="text" class="form-control" id="nomeCurso" th:field="*{nomeCurso}" required placeholder="Ex: Engenharia de Software">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="cargaHorariaCurso" class="form-label fw-semibold">Carga Horária (em horas)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-clock"></i></span>
                                    <input type="number" class="form-control" id="cargaHorariaCurso" th:field="*{cargaHorariaCurso}" required placeholder="Ex: 3000">
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/cursos/listar}" class="btn btn-light px-4">Cancelar</a>
                                <button type="submit" class="btn btn-success px-5 shadow-sm">
                                    <i class="bi bi-check-lg me-1"></i>Salvar Registro
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- VLibras Plugin -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Fim VLibras Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
