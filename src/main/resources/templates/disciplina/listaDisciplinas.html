<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Disciplinas')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Disciplinas</li>
            </ol>
        </nav>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
                <h5 class="card-title mb-0 fw-bold"><i class="bi bi-book-half me-2 text-primary"></i>Lista de Disciplinas</h5>
                <a th:href="@{/disciplinas/criar}" class="btn btn-success btn-sm shadow-sm">
                    <i class="bi bi-plus-lg me-1"></i>Nova Disciplina
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nome da Disciplina</th>
                                <th>Carga Horária (h)</th>
                                <th>Curso</th>
                                <th>Professor</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="disciplina : ${disciplinas}">
                                <td class="fw-semibold text-primary" th:text="${disciplina.nomeDisciplina}"></td>
                                <td th:text="${disciplina.cargaHoraria}"></td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${disciplina.curso != null ? disciplina.curso.nomeCurso : 'N/A'}"></span>
                                </td>
                                <td th:text="${disciplina.professor != null ? disciplina.professor.nomeProfessor : 'N/A'}"></td>
                                <td class="text-end">
                                    <div class="btn-group shadow-sm">
                                        <a th:href="@{/disciplinas/editar/{id}(id=${disciplina.idDisciplina})}" class="btn btn-outline-primary btn-sm" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/disciplinas/excluir/{id}(id=${disciplina.idDisciplina})}" 
                                           class="btn btn-outline-danger btn-sm"
                                           title="Excluir"
                                           onclick="return confirm('Tem certeza que deseja excluir esta disciplina?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(disciplinas)}">
                                <td colspan="5" class="text-center py-4 text-muted small italic">Nenhuma disciplina cadastrada.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
