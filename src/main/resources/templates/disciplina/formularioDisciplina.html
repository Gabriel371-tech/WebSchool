<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Cadastro de Disciplina')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/disciplinas/listar}">Disciplinas</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${disciplina.idDisciplina != null ? 'Editar Disciplina' : 'Nova Disciplina'}"></li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-book-half me-2 text-primary"></i>
                            <span th:text="${disciplina.idDisciplina != null ? 'Editar Disciplina' : 'Cadastro de Disciplina'}"></span>
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/disciplinas/salvar}" th:object="${disciplina}" method="post">
                            <input type="hidden" th:field="*{idDisciplina}">
                            
                            <div class="mb-4">
                                <label for="nome" class="form-label fw-semibold">Nome da Disciplina</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-tag"></i></span>
                                    <input type="text" class="form-control" id="nome" th:field="*{nomeDisciplina}" required placeholder="Ex: Algoritmos e Programação">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="carga" class="form-label fw-semibold">Carga Horária (horas)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-clock"></i></span>
                                    <input type="number" class="form-control" id="carga" th:field="*{cargaHoraria}" required min="1" placeholder="Ex: 60">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="curso" class="form-label fw-semibold">Curso</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-mortarboard"></i></span>
                                        <select class="form-select" id="curso" th:field="*{curso}" required>
                                            <option value="">Selecione um curso...</option>
                                            <option th:each="curso : ${cursos}" 
                                                    th:value="${curso.idCurso}" 
                                                    th:text="${curso.nomeCurso}"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="professor" class="form-label fw-semibold">Professor Responsável</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                        <select class="form-select" id="professor" th:field="*{professor}" required>
                                            <option value="">Selecione um professor...</option>
                                            <option th:each="prof : ${professores}" 
                                                    th:value="${prof.idProfessor}" 
                                                    th:text="${prof.nomeProfessor}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 justify-content-end mt-5">
                                <a th:href="@{/disciplinas/listar}" class="btn btn-light px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="bi bi-check-lg me-1"></i>Salvar Disciplina
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
