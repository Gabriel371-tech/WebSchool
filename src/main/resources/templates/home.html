<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Dashboard')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <div class="row mb-4">
            <div class="col">
                <h1 class="h2"><i class="bi bi-speedometer2 me-2"></i>Dashboard</h1>
                <p class="text-muted">Bem-vindo ao centro de controle do WebSchool.</p>
            </div>
        </div>

        <!-- Dashboard Stats Cards -->
        <div class="row g-4 mb-5">
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 border-start border-primary border-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Alunos</h6>
                                <h3 class="fw-bold mb-0">Gerenciar</h3>
                            </div>
                            <div class="fs-1 text-primary">
                                <i class="bi bi-people"></i>
                            </div>
                        </div>
                        <a th:href="@{/alunos/listar}" class="stretched-link"></a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 border-start border-success border-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Cursos</h6>
                                <h3 class="fw-bold mb-0">Gerenciar</h3>
                            </div>
                            <div class="fs-1 text-success">
                                <i class="bi bi-book"></i>
                            </div>
                        </div>
                        <a th:href="@{/cursos/listar}" class="stretched-link"></a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 border-start border-warning border-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Produtos</h6>
                                <h3 class="fw-bold mb-0">Gerenciar</h3>
                            </div>
                            <div class="fs-1 text-warning">
                                <i class="bi bi-box-seam"></i>
                            </div>
                        </div>
                        <a th:href="@{/produtos/listar}" class="stretched-link"></a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 border-start border-danger border-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Relatórios</h6>
                                <h3 class="fw-bold mb-0">Visualizar</h3>
                            </div>
                            <div class="fs-1 text-danger">
                                <i class="bi bi-graph-up"></i>
                            </div>
                        </div>
                        <a th:href="@{/relatorios}" class="stretched-link"></a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions Card -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="card-title mb-0 fw-bold">Ações Rápidas</h5>
            </div>
            <div class="card-body">
                <div class="row g-3 text-center">
                    <div class="col-6 col-md-3">
                        <a th:href="@{/alunos/criar}" class="btn btn-outline-primary w-100 py-3">
                            <i class="bi bi-person-plus d-block fs-3 mb-2"></i>
                            Novo Aluno
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a th:href="@{/pedidos/criar}" class="btn btn-outline-success w-100 py-3">
                            <i class="bi bi-cart-plus d-block fs-3 mb-2"></i>
                            Novo Pedido
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a th:href="@{/professores/criar}" class="btn btn-outline-info w-100 py-3 text-white" style="background-color: #0dcaf0; border-color: #0dcaf0;">
                            <i class="bi bi-person-badge d-block fs-3 mb-2"></i>
                            Novo Professor
                        </a>
                    </div>
                    <div class="col-6 col-md-3">
                        <a th:href="@{/cursos/criar}" class="btn btn-outline-secondary w-100 py-3">
                            <i class="bi bi-journal-plus d-block fs-3 mb-2"></i>
                            Novo Curso
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
