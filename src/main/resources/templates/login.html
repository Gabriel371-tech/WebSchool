<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Login')}">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="display-6 fw-bold text-primary mb-2">
                                <i class="bi bi-mortarboard-fill"></i> WebSchool
                            </div>
                            <h5 class="text-muted">Bem-vindo de volta!</h5>
                        </div>

                        <form th:action="@{/login}" method="post">
                            <!-- Alert for Error -->
                            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>E-mail ou senha incorretos.
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>

                            <!-- Alert for Logout -->
                            <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
                                <i class="bi bi-check-circle-fill me-2"></i>Você saiu do sistema com sucesso.
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>

                            <!-- General messages -->
                            <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
                            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="emailUsuario" name="username" placeholder="name@example.com" required>
                                <label for="emailUsuario">E-mail</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="senhaUsuario" name="password" placeholder="Senha" required>
                                <label for="senhaUsuario">Senha</label>
                            </div>

                            <div class="d-grid mb-3">
                                <button class="btn btn-primary btn-lg shadow-sm" type="submit">Entrar</button>
                            </div>

                            <div class="text-center">
                                <a th:href="@{/forgot_password}" class="text-decoration-none small text-muted">Esqueceu a senha?</a>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-white border-0 py-4 text-center">
                        <p class="mb-0 text-muted">Não tem uma conta? <a th:href="@{/usuarios/criar}" class="fw-bold text-decoration-none text-primary">Cadastre-se</a></p>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a th:href="@{/webschool}" class="text-muted text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i>Voltar para a página inicial
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
