<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Professores')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Professores</li>
            </ol>
        </nav>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
                <h5 class="card-title mb-0 fw-bold"><i class="bi bi-person-workspace me-2 text-primary"></i>Lista de Professores</h5>
                <a th:href="@{/professores/criar}" class="btn btn-success btn-sm shadow-sm">
                    <i class="bi bi-plus-lg me-1"></i>Novo Professor
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Especialidade</th>
                                <th>Email</th>
                                <th class="d-none d-md-table-cell">Telefone</th>
                                <th class="d-none d-lg-table-cell">CPF</th>
                                <th>Curso</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="professor : ${professores}">
                                <td class="fw-semibold text-primary" th:text="${professor.nomeProfessor}"></td>
                                <td th:text="${professor.especialidade}"></td>
                                <td th:text="${professor.emailProfessor}"></td>
                                <td class="d-none d-md-table-cell" th:text="${professor.telefoneProfessor}"></td>
                                <td class="d-none d-lg-table-cell" th:text="${professor.cpfProfessor}"></td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${professor.curso != null ? professor.curso.nomeCurso : 'N/A'}"></span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group shadow-sm">
                                        <a th:href="@{/professores/editar/{id}(id=${professor.idProfessor})}" class="btn btn-outline-primary btn-sm" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/professores/excluir/{id}(id=${professor.idProfessor})}" 
                                           class="btn btn-outline-danger btn-sm"
                                           title="Excluir"
                                           onclick="return confirm('Tem certeza que deseja excluir este professor?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(professores)}">
                                <td colspan="7" class="text-center py-4 text-muted small italic">Nenhum professor cadastrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
