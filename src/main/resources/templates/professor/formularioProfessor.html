<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Cadastro de Professor')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/professores/listar}">Professores</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${professor.idProfessor != null ? 'Editar Professor' : 'Novo Professor'}"></li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-person-workspace me-2 text-primary"></i>
                            <span th:text="${professor.idProfessor != null ? 'Editar Professor' : 'Cadastro de Professor'}"></span>
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/professores/salvar}" th:object="${professor}" method="post">
                            <input type="hidden" th:field="*{idProfessor}">
                            
                            <div class="mb-4">
                                <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="nome" th:field="*{nomeProfessor}" required placeholder="Ex: João Silva">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold">E-mail</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email" th:field="*{emailProfessor}" placeholder="email@exemplo.com">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="telefone" class="form-label fw-semibold">Telefone</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                        <input type="text" class="form-control" id="telefone" th:field="*{telefoneProfessor}" required placeholder="(00) 00000-0000">
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="cpf" class="form-label fw-semibold">CPF</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                        <input type="text" class="form-control" id="cpf" th:field="*{cpfProfessor}" required placeholder="000.000.000-00">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="especialidade" class="form-label fw-semibold">Especialidade</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-patch-check"></i></span>
                                        <input type="text" class="form-control" id="especialidade" th:field="*{especialidade}" required placeholder="Ex: Matemática Aplicada">
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label for="cidade" class="form-label fw-semibold">Cidade</label>
                                    <input type="text" class="form-control" id="cidade" th:field="*{cidadeProfessor}" required placeholder="Cidade">
                                </div>
                                <div class="col-md-8">
                                    <label for="endereco" class="form-label fw-semibold">Endereço</label>
                                    <input type="text" class="form-control" id="endereco" th:field="*{enderecoProfessor}" required placeholder="Rua, número, bairro">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="curso" class="form-label fw-semibold">Curso Vinculado</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-book"></i></span>
                                    <select class="form-select" id="curso" th:field="*{curso}" required>
                                        <option value="">Selecione um curso...</option>
                                        <option th:each="curso : ${cursos}" 
                                                th:value="${curso.idCurso}" 
                                                th:text="${curso.nomeCurso}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex gap-2 justify-content-end mt-5">
                                <a th:href="@{/professores/listar}" class="btn btn-light px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="bi bi-check-lg me-1"></i>Salvar Professor
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
