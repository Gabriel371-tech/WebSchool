<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Novo Pedido')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/pedidos/listar}">Pedidos</a></li>
                <li class="breadcrumb-item active" aria-current="page">Novo Pedido</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold">
                            <i class="bi bi-cart-plus me-2 text-primary"></i>Novo Pedido
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post" id="pedidoForm">
                            <div class="mb-4">
                                <label for="aluno" class="form-label fw-semibold">Aluno (Comprador)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <select class="form-select" id="aluno" th:field="*{aluno}" required>
                                        <option value="">Selecione um aluno...</option>
                                        <option th:each="aluno : ${alunos}" 
                                                th:value="${aluno.idAluno}" 
                                                th:text="${aluno.nomeAluno}"></option>
                                    </select>
                                </div>
                            </div>

                            <hr class="my-4">
                            <h6 class="fw-bold mb-3"><i class="bi bi-list-check me-2"></i>Itens do Pedido</h6>
                            
                            <div id="itensContainer">
                                <!-- Primeira linha de item -->
                                <div class="item-row card bg-light border-0 mb-3">
                                    <div class="card-body p-3">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-md-6">
                                                <label class="form-label small fw-semibold">Produto</label>
                                                <select class="form-select" name="itens[0].produto.idProduto" required>
                                                    <option value="">Selecione...</option>
                                                    <option th:each="prod : ${produtos}" 
                                                            th:value="${prod.idProduto}" 
                                                            th:data-preco="${prod.precoProduto}"
                                                            th:text="${prod.nomeProduto + ' (R$ ' + prod.precoProduto + ')'}"></option>
                                                </select>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label small fw-semibold">Quantidade</label>
                                                <input type="number" class="form-control" name="itens[0].quantidade" value="1" min="1" required>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label small fw-semibold">Preço Unitário</label>
                                                <div class="input-group">
                                                    <span class="input-group-text">R$</span>
                                                    <input type="number" class="form-control" name="itens[0].precoUnitario" step="0.01" required>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 justify-content-end mt-5">
                                <a th:href="@{/pedidos/listar}" class="btn btn-light px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="bi bi-check-lg me-1"></i>Finalizar Pedido
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Script simples para preencher o preço unitário ao selecionar o produto
        document.addEventListener('change', function(e) {
            if (e.target.tagName === 'SELECT' && e.target.name.includes('produto')) {
                const option = e.target.options[e.target.selectedIndex];
                const preco = option.getAttribute('data-preco');
                const row = e.target.closest('.item-row');
                const precoInput = row.querySelector('input[name*="precoUnitario"]');
                if (preco) precoInput.value = preco;
            }
        });
    </script>
</body>
</html>
