<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WebSchool | Detalhes do Pedido')}">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/pedidos/listar}">Pedidos</a></li>
                <li class="breadcrumb-item active" aria-current="page">Detalhes do Pedido</li>
            </ol>
        </nav>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
                <h5 class="card-title mb-0 fw-bold">
                    <i class="bi bi-info-circle me-2 text-primary"></i>Pedido #<span th:text="${pedido.idPedido}"></span>
                </h5>
                <div class="d-flex align-items-center gap-3">
                    <span class="small fw-semibold text-muted">Alterar Status:</span>
                    <form th:action="@{/pedidos/atualizar-status/{id}(id=${pedido.idPedido})}" method="post" class="d-inline">
                        <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="PENDENTE" th:selected="${pedido.statusPedido == 'PENDENTE'}">PENDENTE</option>
                            <option value="CONCLUIDO" th:selected="${pedido.statusPedido == 'CONCLUIDO'}">CONCLUÍDO</option>
                            <option value="CANCELADO" th:selected="${pedido.statusPedido == 'CANCELADO'}">CANCELADO</option>
                        </select>
                    </form>
                </div>
            </div>
            <div class="card-body p-4">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <p class="mb-1 text-muted small fw-bold text-uppercase">Aluno</p>
                        <p class="fs-5 fw-semibold text-primary" th:text="${pedido.aluno != null ? pedido.aluno.nomeAluno : 'N/A'}"></p>
                    </div>
                    <div class="col-md-4 text-md-center">
                        <p class="mb-1 text-muted small fw-bold text-uppercase">Data do Pedido</p>
                        <p class="fs-5" th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></p>
                    </div>
                    <div class="col-md-4 text-md-end">
                        <p class="mb-1 text-muted small fw-bold text-uppercase">Status Atual</p>
                        <span class="badge fs-6" 
                              th:classappend="${pedido.statusPedido == 'CONCLUIDO' ? 'bg-success' : (pedido.statusPedido == 'CANCELADO' ? 'bg-danger' : 'bg-warning')}"
                              th:text="${pedido.statusPedido}"></span>
                    </div>
                </div>

                <hr class="my-4">
                <h6 class="fw-bold mb-3"><i class="bi bi-list-ul me-2"></i>Itens do Pedido</h6>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Produto</th>
                                <th class="text-center">Qtd</th>
                                <th class="text-end">Preço Unitário</th>
                                <th class="text-end">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${pedido.itens}">
                                <td class="fw-semibold" th:text="${item.produto.nomeProduto}"></td>
                                <td class="text-center" th:text="${item.quantidade}"></td>
                                <td class="text-end" th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 2, 'COMMA')}"></td>
                                <td class="text-end fw-bold" th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario * item.quantidade, 1, 2, 'COMMA')}"></td>
                            </tr>
                        </tbody>
                        <tfoot class="table-group-divider">
                            <tr class="table-light">
                                <th colspan="3" class="text-end py-3">TOTAL DO PEDIDO:</th>
                                <th class="text-end py-3 fs-5 text-success" th:text="${'R$ ' + #numbers.formatDecimal(pedido.totalPedido, 1, 2, 'COMMA')}"></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-start">
            <a th:href="@{/pedidos/listar}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Voltar para Lista
            </a>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
